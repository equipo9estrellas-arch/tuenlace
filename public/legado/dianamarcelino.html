<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diana Marcelino — Asesoría y Formación Gastronómica</title>
  <meta name="description" content="Asesoría y formación gastronómica gourmet con Diana Marcelino, chef tinerfeña. Lleva tu cocina al siguiente nivel." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold: #A6783C;
      --gold-dark: #8A5F2A;
      --black: #1C1A16;
      --gray: #5C5650;
      --cream: #FAF6EF;
      --border: #E8E1D3;
      --white: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    header {
      padding: 22px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
      background: var(--white);
    }

    header .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--black);
    }

    header .brand span { color: var(--gold); }

    /* ── HERO ── */
    .hero {
      padding: 64px 24px 48px;
      text-align: center;
      max-width: 700px;
      margin: 0 auto;
    }

    .hero-tag {
      display: inline-block;
      background: var(--gold);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 2px;
      margin-bottom: 24px;
    }

    .hero h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 5vw, 3.1rem);
      font-weight: 700;
      line-height: 1.18;
      color: var(--black);
      margin-bottom: 18px;
      letter-spacing: -0.01em;
    }

    .hero h2 span {
      color: var(--gold);
    }

    .hero p {
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.7;
      color: var(--gray);
      max-width: 540px;
      margin: 0 auto;
    }

    /* ── DIVIDER ── */
    .divider {
      height: 3px;
      background: var(--gold);
      width: 60px;
      margin: 32px auto;
    }

    /* ── FORM SECTION ── */
    .form-section {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    .form-label {
      text-align: center;
      margin-bottom: 24px;
    }

    .form-label h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--black);
      margin-bottom: 6px;
    }

    .form-label p {
      font-size: 0.85rem;
      color: var(--gray);
      font-weight: 400;
    }

    .form-wrapper {
      background: var(--cream);
      border: 1px solid var(--border);
      border-top: 3px solid var(--gold);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
      padding: 4px;
    }

    .form-wrapper iframe {
      width: 100%;
      height: 521px;
      border: none;
      border-radius: 8px;
      display: block;
    }

    .form-note {
      text-align: center;
      margin-top: 14px;
      font-size: 0.76rem;
      color: #999;
      font-weight: 400;
    }

    .form-note a {
      color: var(--gold);
      text-decoration: none;
    }

    .form-note a:hover {
      text-decoration: underline;
    }

    /* ── FOOTER ── */
    footer {
      background: var(--black);
      color: rgba(255,255,255,0.4);
      text-align: center;
      padding: 24px 24px;
      font-size: 0.75rem;
      font-weight: 400;
      line-height: 1.9;
    }

    footer a {
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: var(--gold); }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    /* ── GOLD TOP BAR ── */
    .top-bar {
      height: 5px;
      background: var(--gold);
    }

    @media (max-width: 480px) {
      header { padding: 16px 20px; }
      .hero { padding: 48px 20px 36px; }
      .form-section { padding: 0 16px 60px; }
    }
  </style>
</head>
<body>

  <div class="top-bar"></div>

  <header>
    <div class="brand">Diana <span>Marcelino</span></div>
  </header>
  <section class="form-section">
    <div class="form-wrapper">
      <iframe
        src="https://api.leadconnectorhq.com/widget/form/6RQTlpTO4xp3uWE8iD1E"
        style="width:100%;height:100%;border:none;border-radius:8px"
        id="inline-6RQTlpTO4xp3uWE8iD1E"
        data-layout="{'id':'INLINE'}"
        data-trigger-type="alwaysShow"
        data-trigger-value=""
        data-activation-type="alwaysActivated"
        data-activation-value=""
        data-deactivation-type="neverDeactivate"
        data-deactivation-value=""
        data-form-name="Form 0"
        data-height="521"
        data-layout-iframe-id="inline-6RQTlpTO4xp3uWE8iD1E"
        data-form-id="6RQTlpTO4xp3uWE8iD1E"
        title="Form 0"
      ></iframe>
    </div>

    <p class="form-note">
      Tus datos se tratan conforme al RGPD
    </p>
  </section>

  <footer>
    <div>Diana Marcelino · © 2026 Todos los derechos reservados.</div>
  </footer>

  <script src="https://link.msgsndr.com/js/form_embed.js"></script>

</body>
</html>
